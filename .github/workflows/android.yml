name: Android CI

# Laid out as a graph rather than one job, so the run page says *what* failed — "Unit tests (maps)",
# "Android lint" — instead of a single red "build":
#
#                          ┌─ Validate Gradle wrapper
#   Collect info & changes ┼─ Lint workflow files
#                          └─ Prepare Gradle ─┬─ Compile (debug)
#                                             ├─ Android lint
#                                             ├─ Unit tests (matrix, one job per feature) ── Test report
#                                             └─ Release build (R8, unsigned)
#
# Release signing needs local.properties + tv-assist-release.jks, which are git-ignored and stay on
# the dev machine, so the release job proves R8 and resource shrinking work; it does not produce a
# shippable APK.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  info:
    name: Collect info & changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      workflows: ${{ steps.changes.outputs.workflows }}
      test-matrix: ${{ steps.areas.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # What changed decides what runs: a README-only push skips the whole build (shown as skipped
      # on the graph). A manual run, a new branch, or anything we cannot diff runs everything.
      - name: Detect changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          all() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "workflows=true" >> "$GITHUB_OUTPUT"; echo "Running everything: $1"; exit 0; }
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) all "manual run" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            all "no base commit to compare with"
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          while IFS= read -r file; do echo "  $file"; done <<< "$changed"
          # The build: app sources and resources, Gradle files, and CI itself (a workflow change
          # must prove it still builds).
          if echo "$changed" | grep -qE '^(app/|gradle/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|gradlew|\.github/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^\.github/'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi

      # Every test class must belong to exactly one feature area (.github/test-areas.json), or this
      # fails and nothing else runs — a test with no area would otherwise never run in CI at all.
      # Builds the unit-test matrix from the same file.
      - name: Check unit test areas
        id: areas
        run: python3 .github/scripts/test_areas.py .github/test-areas.json app/src/test

  wrapper:
    name: Validate Gradle wrapper
    needs: info
    if: needs.info.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checks gradle-wrapper.jar against Gradle's published checksums: a tampered wrapper would
      # run arbitrary code in every build.
      - uses: gradle/actions/wrapper-validation@v6

  actionlint:
    name: Lint workflow files
    needs: info
    if: needs.info.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned image rather than a script fetched from a branch: the same actionlint every run.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  prepare:
    name: Prepare Gradle
    needs: info
    if: needs.info.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle-build
      # Resolve everything the jobs below will need, once, so they start from a warm cache
      # instead of each downloading the same dependencies in parallel.
      - name: Download dependencies
        run: >
          ./gradlew --no-daemon -q
          :app:dependencies --configuration debugRuntimeClasspath
          :app:dependencies --configuration releaseRuntimeClasspath
          :app:dependencies --configuration debugUnitTestRuntimeClasspath

  compile:
    name: Compile (debug)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle-build
      - name: assembleDebug
        run: ./gradlew --no-daemon :app:assembleDebug

  lint:
    name: Android lint
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To show lint findings on the code (GitHub code scanning).
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle-build
      - name: lintDebug
        run: ./gradlew --no-daemon :app:lintDebug
      # Errors only: lint's warnings are acknowledged noise (see the script) and would bury the
      # Security tab. The full report, warnings included, is still the artifact below.
      - name: Keep lint errors only
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        run: >
          python3 .github/scripts/sarif_errors_only.py
          app/build/reports/lint-results-debug.sarif app/build/reports/lint-errors.sarif
      # Annotations on the changed lines of a PR. A fork's PR gets no write token, so this may be
      # refused there — the lint result itself (the step above) is what passes or fails the job.
      - name: Show errors on the code
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-errors.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-errors.sarif
          category: android-lint
      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests (${{ matrix.area }})
    needs: [info, prepare]
    runs-on: ubuntu-latest
    strategy:
      # Every area reports, even when one fails — the point is seeing which.
      fail-fast: false
      # One job per feature area, from .github/test-areas.json (built by the info job).
      matrix:
        include: ${{ fromJSON(needs.info.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle-build
      - name: testDebugUnitTest
        env:
          TEST_INCLUDE: ${{ matrix.include }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest "-PtestInclude=${TEST_INCLUDE}"
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.slug }}
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.slug }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  report:
    name: Test report
    needs: unit-tests
    if: ${{ !cancelled() && needs.unit-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: results
      # One table for the whole matrix on the run's summary page, plus an annotation per failure.
      - name: Summarise
        run: python3 .github/scripts/test_report.py results .github/test-areas.json

  release:
    name: Release build (R8, unsigned)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle-build
      # R8 shrinking and obfuscation only happen here. Release-only breakage — a missing keep rule,
      # a class R8 renamed that something looks up by name — passes every other job.
      - name: assembleRelease
        run: ./gradlew --no-daemon :app:assembleRelease
